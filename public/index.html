<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <title>Karyaniti | Nepal Supreme Court Cases</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">NEPAL SUPREME COURT CASES</p>
        <h1>Karyaniti</h1>
        <p class="intro">Search and browse the case corpus by legal case type.</p>
        <p><a class="official-link" href="/blog/">Read the Karyaniti blog</a></p>
      </header>

      <section class="search-panel" aria-label="Case search">
        <form id="search-form">
          <label for="query">Search the case text</label>
          <div class="search-row">
            <div class="input-shell">
              <div class="mode-toggle" role="group" aria-label="Typing mode">
                <button id="english-mode" type="button" aria-pressed="true">English</button>
                <button id="nepali-mode" type="button" aria-pressed="false">नेपाली</button>
              </div>
              <input id="query" name="q" type="search" placeholder="Try a case number, name, or legal phrase" autocomplete="off" spellcheck="false" />
            </div>
            <select id="type" name="type" aria-label="Filter by case type">
              <option value="">All case types</option>
            </select>
            <button type="submit">Search</button>
          </div>
        </form>
      </section>

      <section id="stats" class="stats" aria-label="Corpus summary"></section>
      <section class="results-head">
        <h2 id="results-title">Browse the corpus</h2>
        <p id="result-count"></p>
      </section>
      <section id="results" class="results" aria-live="polite"></section>
      <nav id="pagination" class="pagination" aria-label="Search results pages"></nav>
    </main>
    <dialog id="case-dialog">
      <button id="close-dialog" class="close" type="button" aria-label="Close case">×</button>
      <p id="dialog-type" class="eyebrow"></p>
      <h2 id="dialog-title"></h2>
      <a id="official-link" class="official-link" target="_blank" rel="noopener">View official case</a>
      <pre id="dialog-text"></pre>
    </dialog>
    <button id="feedback-open" class="feedback-fab" type="button">Feedback</button>
    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
      <button id="feedback-close" class="close" type="button" aria-label="Close feedback">×</button>
      <p class="eyebrow">HELP US IMPROVE</p>
      <h2 id="feedback-title">Send feedback</h2>
      <form id="feedback-form">
        <label for="feedback-kind">Type</label>
        <select id="feedback-kind" name="kind">
          <option value="suggestion">Suggestion</option>
          <option value="bug">Something is not working</option>
          <option value="question">Question</option>
          <option value="other">Other</option>
        </select>
        <label for="feedback-message">Message</label>
        <textarea id="feedback-message" name="message" rows="5" required minlength="3" maxlength="5000" placeholder="What should we improve?"></textarea>
        <label for="feedback-email">Email <span>(optional)</span></label>
        <input id="feedback-email" name="email" type="email" maxlength="254" placeholder="If you want a reply" />
        <div class="feedback-actions">
          <button id="feedback-cancel" class="feedback-cancel" type="button">Cancel</button>
          <button type="submit">Send feedback</button>
        </div>
        <p id="feedback-status" class="feedback-status" aria-live="polite"></p>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
